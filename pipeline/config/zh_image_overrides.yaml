# Image rules for the zh pack (yuki-authored).
# Words whose POS is a function word (conj, prep, part, adv, pron, num, m, intj, affixes,
# phrases) are always typographic. For nouns/verbs/adjectives, a first gloss matching one
# of these patterns is treated as abstract -> typographic card instead of generated art.
typographic_gloss_patterns:
  # cognition, modality, existence, relations
  - "^to (be|become|have|think|believe|know|understand|realize|feel|hope|wish|want|need|must|should|seem|appear to be|consider|decide|mean|exist|happen|occur|allow|let|cause|enable|ensure|include|contain|belong|depend|involve|relate|concern|lack|own|possess|suppose|assume|guess|doubt|plan|intend|expect|imagine|remember|forget|recognize|regard|treat|count|equal|compare|differ|represent|indicate|signify|reflect|prove|determine|confirm|deny|admit|agree|refuse|approve|permit|forbid|oblige|require|demand|request|suggest|propose|advise|recommend|insist|persist|continue|keep|remain|stay|maintain|last|begin|start|end|finish|complete|stop|cease)\\b"
  - "^(reason|method|way|means|manner|situation|circumstance|condition|state|status|problem|question|issue|matter|affair|aspect|respect|quality|level|degree|extent|scope|range|relation|relationship|connection|influence|effect|impact|result|consequence|outcome|purpose|aim|goal|objective|meaning|significance|sense|idea|concept|notion|thought|opinion|view|viewpoint|attitude|ability|capability|capacity|experience|knowledge|theory|principle|policy|system|mechanism|structure|process|procedure|basis|foundation|standard|criterion|norm|rule|regulation|fact|truth|reality|chance|opportunity|possibility|probability|responsibility|duty|obligation|right|privilege|advantage|benefit|interest|value|nature|character|feature|characteristic|property|content|form|style|mode|type|kind|sort|category|class|part|portion|section|whole|total|amount|quantity|number|proportion|ratio|rate|period|stage|phase|era|age|moment|instant|occasion|future|past|present|history|plan|scheme|strategy|policy|task|mission|business|thing|stuff|object|item|element|factor|component|detail|point|aspect|direction|trend|tendency|habit|custom|tradition|culture|civilization|society|economy|politics|law|morality|ethics|spirit|mind|soul|emotion|feeling|mood|atmosphere|environment|background|context|field|domain|area|realm|sphere|industry|market|resource|source|origin|cause|motive|reason|excuse|mistake|error|fault|defect|shortcoming|merit|strength|weakness|difference|similarity|contrast|balance|order|sequence|arrangement|organization|management|administration|leadership|authority|power|force|energy|effort|attempt|trial|test|experiment|research|study|analysis|survey|investigation|examination|evaluation|assessment|estimate|calculation|statistics|data|information|message|news|report|record|document|file|material|matter|substance|content|subject|topic|theme|title|term|word|phrase|expression|language|grammar|meaning)\\b"
  - "^(of|in|on|at|for|with|by|from|as|so|very|quite|rather|extremely|relatively|comparatively|especially|particularly|generally|usually|always|never|often|sometimes|already|still|yet|just|only|even|also|too|again|once|soon|then|now|before|after|during|while|since|until|unless|although|though|because|therefore|however|but|and|or|if|whether)\\b"

  # time expressions, places-as-concepts and other words FLUX can only draw as text or a blob
  - "^(this|that|next|last|every|each|previous|following) "
  - "^(year|month|week|day|hour|minute|second|time|period|era|age|place|location|spot|country|nation|state|area|region|district|zone|side|direction|position|name|surname|language|word|character|sentence|text|number|amount|price|cost|fee|size|length|height|weight|speed|temperature|distance|kind|sort)$"
  - "^(early|late|before|after|ago|recently|nowadays|formerly|originally|currently|finally|gradually|suddenly)"

# Per-word overrides by id: kind: typographic | flux, and an optional FLUX subject.
# words:
#   "zh:长城:chang2cheng2:n": {kind: flux, subject: "the Great Wall of China"}
words: {}
