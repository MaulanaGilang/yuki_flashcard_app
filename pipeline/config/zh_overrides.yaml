# Hand-curated corrections applied in the enrich stage (yuki-authored, CC0).
# Keys are stable word ids. `senses` replaces the CC-CEDICT glosses entirely.
# Used for entries CC-CEDICT lacks (compositional HSK phrases) and for split senses
# (称1 "to call" vs 称2 "to weigh").

